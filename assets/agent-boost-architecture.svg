<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Boost local privacy sidecar architecture</title>
  <desc id="desc">An agent uses strict MCP tools or loopback compatibility endpoints. Agent Boost exposes coherent wallet context, binds exact payment plans to immutable preparation requests, applies policy and redacted receipts, delegates wallet operations to Kohaku, and forces dark HTTP and Ethereum RPC through Shade Tree. A separate operator authority controls unlocking and approval.</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191820"/>
      <stop offset="1" stop-color="#0f0f14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#c9ff57"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8268ff"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#777382"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#07070a"/>
  <circle cx="840" cy="418" r="350" fill="#7659ff" opacity="0.055"/>
  <circle cx="1280" cy="510" r="250" fill="#c9ff57" opacity="0.035"/>

  <text x="76" y="82" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="40" font-weight="750">ONE LOCAL CONTROL PLANE · TWO PRIVACY ADAPTERS</text>
  <text x="76" y="125" fill="#9a96a6" font-family="Inter, ui-sans-serif, system-ui" font-size="21">MCP for strict mode. Loopback compatibility. No silent downgrade.</text>

  <!-- Agent runtime -->
  <rect x="76" y="230" width="270" height="272" rx="28" fill="#f4f1ea"/>
  <rect x="111" y="265" width="88" height="88" rx="20" fill="#dcd7ff"/>
  <rect x="135" y="289" width="40" height="40" rx="9" fill="#7659ff"/>
  <path d="M143 309h24M155 297v24" stroke="#c9ff57" stroke-width="4" stroke-linecap="round"/>
  <text x="111" y="408" fill="#111116" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="760">AGENT RUNTIME</text>
  <text x="111" y="446" fill="#575361" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Untrusted for secrets</text>
  <text x="111" y="477" fill="#575361" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Bounded intents only</text>

  <!-- Operator -->
  <rect x="76" y="580" width="270" height="150" rx="24" fill="#121117" stroke="#393642" stroke-width="2"/>
  <text x="111" y="625" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="760">OPERATOR CLI</text>
  <text x="111" y="666" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="650">unlock · inspect</text>
  <text x="111" y="698" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="650">approve · reject</text>

  <!-- Agent arrows -->
  <line x1="346" y1="335" x2="444" y2="335" stroke="#c9ff57" stroke-width="5" marker-end="url(#arrow-lime)"/>
  <text x="363" y="307" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">MCP</text>
  <line x1="346" y1="432" x2="444" y2="432" stroke="#8268ff" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <text x="357" y="405" fill="#a799ff" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">PROXY / RPC</text>

  <!-- Agent Boost core -->
  <rect x="458" y="178" width="534" height="590" rx="32" fill="url(#core)" stroke="#3b3745" stroke-width="2"/>
  <rect x="493" y="214" width="72" height="72" rx="16" fill="#09090c" stroke="#8268ff" stroke-width="3"/>
  <path d="M512 250h34M529 233v34" stroke="#c9ff57" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <text x="592" y="247" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="35" font-weight="770">AGENT BOOST</text>
  <text x="592" y="280" fill="#9a96a6" font-family="Inter, ui-sans-serif, system-ui" font-size="18">local privacy sidecar</text>
  <line x1="493" y1="320" x2="956" y2="320" stroke="#393642" stroke-width="2"/>

  <rect x="493" y="350" width="217" height="101" rx="18" fill="#20221b" stroke="#52652d"/>
  <text x="517" y="383" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="760">STRICT INTERFACE</text>
  <text x="517" y="414" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="19" font-weight="670">context · plan · prepare</text>

  <rect x="734" y="350" width="222" height="101" rx="18" fill="#1b1825" stroke="#55488a"/>
  <text x="758" y="383" fill="#a799ff" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="760">COMPATIBILITY</text>
  <text x="758" y="420" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="670">127.0.0.1 only</text>

  <rect x="493" y="482" width="217" height="102" rx="18" fill="#111116" stroke="#35323d"/>
  <text x="517" y="518" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="760">POLICY</text>
  <text x="517" y="553" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="670">validate · limit</text>

  <rect x="734" y="482" width="222" height="102" rx="18" fill="#111116" stroke="#35323d"/>
  <text x="758" y="518" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="760">APPROVALS</text>
  <text x="758" y="553" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="670">reserve · approve</text>

  <rect x="493" y="615" width="217" height="102" rx="18" fill="#111116" stroke="#35323d"/>
  <text x="517" y="651" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="760">REQUEST JOURNAL</text>
  <text x="517" y="686" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="670">idempotent state</text>

  <rect x="734" y="615" width="222" height="102" rx="18" fill="#111116" stroke="#35323d"/>
  <text x="758" y="651" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="760">RECEIPTS</text>
  <text x="758" y="686" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="670">redacted by default</text>

  <!-- Operator control path -->
  <path d="M346 655 H405 Q430 655 430 680 V707 Q430 735 458 735" fill="none" stroke="#777382" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <text x="365" y="635" fill="#8f8a99" font-family="Inter, ui-sans-serif, system-ui" font-size="14">separate operator authority required</text>

  <!-- Adapter paths -->
  <line x1="992" y1="330" x2="1058" y2="330" stroke="#c9ff57" stroke-width="5" marker-end="url(#arrow-lime)"/>
  <text x="1001" y="305" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700">WALLET</text>
  <line x1="992" y1="570" x2="1058" y2="570" stroke="#8268ff" stroke-width="5" marker-end="url(#arrow-violet)"/>
  <text x="1019" y="544" fill="#a799ff" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700">HTTP</text>

  <!-- Kohaku -->
  <rect x="1072" y="225" width="360" height="205" rx="26" fill="#f4f1ea"/>
  <text x="1108" y="272" fill="#7659ff" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="780">WALLET ADAPTER</text>
  <text x="1108" y="320" fill="#111116" font-family="Inter, ui-sans-serif, system-ui" font-size="31" font-weight="760">Kohaku CLI</text>
  <text x="1108" y="360" fill="#575361" font-family="Inter, ui-sans-serif, system-ui" font-size="18">encrypted keys · stealth receive</text>
  <text x="1108" y="394" fill="#575361" font-family="Inter, ui-sans-serif, system-ui" font-size="18">operator-approved signing</text>

  <!-- Shade Tree -->
  <rect x="1072" y="477" width="360" height="205" rx="26" fill="#111116" stroke="#3b3745" stroke-width="2"/>
  <text x="1108" y="524" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="780">EGRESS ADAPTER</text>
  <text x="1108" y="572" fill="#f4f1ea" font-family="Inter, ui-sans-serif, system-ui" font-size="31" font-weight="760">Shade Tree</text>
  <text x="1108" y="612" fill="#9a96a6" font-family="Inter, ui-sans-serif, system-ui" font-size="18">proof-gated Tor transport</text>
  <text x="1108" y="646" fill="#9a96a6" font-family="Inter, ui-sans-serif, system-ui" font-size="18">fail closed · no direct retry</text>

  <!-- Wallet RPC forced through egress -->
  <path d="M1390 430 V447 Q1390 464 1372 464 H1125 Q1107 464 1107 477" fill="none" stroke="#8268ff" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-violet)"/>
  <text x="1142" y="455" fill="#a799ff" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700">WALLET RPC → HTTPS EGRESS</text>

  <!-- External destination -->
  <line x1="1432" y1="580" x2="1500" y2="580" stroke="#777382" stroke-width="4" marker-end="url(#arrow-muted)"/>
  <circle cx="1530" cy="580" r="29" fill="#17161d" stroke="#c9ff57" stroke-width="3"/>
  <circle cx="1530" cy="580" r="8" fill="#c9ff57"/>
  <text x="1462" y="632" fill="#9a96a6" font-family="Inter, ui-sans-serif, system-ui" font-size="15">internet</text>
  <text x="1456" y="654" fill="#9a96a6" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Sepolia</text>

  <!-- Mode callouts -->
  <rect x="1072" y="731" width="170" height="74" rx="18" fill="#20221b" stroke="#52652d"/>
  <text x="1096" y="760" fill="#c9ff57" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="780">STRICT MODE</text>
  <text x="1096" y="786" fill="#d9ddce" font-family="Inter, ui-sans-serif, system-ui" font-size="15">sandbox + MCP</text>
  <rect x="1262" y="731" width="230" height="74" rx="18" fill="#1b1825" stroke="#55488a"/>
  <text x="1286" y="760" fill="#a799ff" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="780">COMPAT MODE</text>
  <text x="1286" y="786" fill="#d8d2ed" font-family="Inter, ui-sans-serif, system-ui" font-size="15">proxy env · best effort</text>

  <line x1="76" y1="836" x2="1492" y2="836" stroke="#2e2b35" stroke-width="2"/>
  <text x="76" y="869" fill="#8f8a99" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Agent sees public state · exact plans bind review requests · keys and approval stay outside the agent</text>
</svg>
