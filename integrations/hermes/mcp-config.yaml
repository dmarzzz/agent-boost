mcp_servers:
  agent-boost:
    command: /absolute/path/to/agent-boost
    args: [mcp, --mode, dark, --contract-major, "1"]
    enabled: true
    timeout: 180
    supports_parallel_tool_calls: false
    tools:
      include:
        - capabilities
        - onboarding_start
        - onboarding_status
        - wallet_get_context
        - wallet_get_tree
        - wallet_get_policy
        - wallet_plan_policy_update
        - wallet_apply_policy_update
        - wallet_start_new_demo
        - wallet_plan_private_payment
        - wallet_execute_private_payment
        - wallet_get_request
        - egress_capabilities
        - egress_status
        - egress_fetch
      resources: false
      prompts: false
