mcp_servers:
  agent-boost:
    command: /absolute/path/to/agent-boost
    args: [mcp, --mode, dark, --contract-major, "1"]
    enabled: true
    supports_parallel_tool_calls: false
    tools:
      include:
        - capabilities
        - dark_fetch
        - wallet_get_context
        - wallet_plan_payment
        - wallet_create_receive
        - wallet_prepare_payment
        - wallet_get_request
      resources: false
      prompts: false
