# Dependabot: weekly dependency and toolchain update PRs for the two ecosystems
# this repo ships: npm (root) and the GitHub Actions pinned in the workflows.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # TypeScript 7 is the native rewrite, and it stops exporting the
      # compiler API from the package root: its export map resolves "." to
      # ./lib/version.cjs, and the AST moved behind typescript/unstable/*.
      # test/cli-fast-path.test.ts parses src/cli.ts with that API to prove
      # the Hermes turn-gate entrypoint stays free of eager local imports, so
      # taking 7.x means rewriting that check against an API TypeScript
      # itself labels unstable. Hold on 5.x until the API settles.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
