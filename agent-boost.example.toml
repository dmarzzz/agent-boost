# Documentation-only reference. The 0.1 POC reads equivalent
# AGENT_BOOST_* environment variables; it does not parse this file.
version = 1
mode = "dark"
network = "sepolia"

[state]
directory = "~/.local/share/agent-boost"

[ui]
host = "127.0.0.1"
port = 9183
open_browser = true

[wallet]
adapter = "kohaku"
install_directory = "~/.local/share/agent-boost/dependencies/kohaku-cli"
data_directory = "~/.local/share/agent-boost/kohaku"
name = "agent-boost"
funding_wei = "200000000000000000"
shield_wei = "100000000000000000"
auto_shield = true

[delegation]
mode = "testnet_delegated"
execute = true
payment_limit_wei = "50000000000000000"
maximum_payments = 1
expires_after_hours = 168

[security]
# Built-in defaults are merged with explicit local overrides. The current POC
# maps payment_execute to AGENT_BOOST_PAYMENT_APPROVAL=allow|confirm|deny.
default = "confirm"

[security.overrides]
# payment_execute = "allow"

[rpc]
network = "sepolia"
require_https = true
route = "tor"
scope = "ethereum_json_rpc"
loopback_port = 9185
direct_fallback = false

[general_egress]
mode = "explicit_fetch"
adapter = "shade-tree-v4"
loopback_port = 9186
direct_fallback = false
requires_operator_enrollment = true
whole_agent_proxy = false

[private_inference]
enabled = false
adapter = "aci"
base_url = "https://tee.redpill.ai/v1"
api_key_environment = "AGENT_BOOST_PRIVATE_INFERENCE_API_KEY"
model = "provider/model-id"
model_allowlist = ["provider/model-id"]
trust_mode = "reviewed_release"
accepted_compose_hashes = ["replace-with-reviewed-64-character-sha256"]
accepted_session_ids = []
request_timeout_ms = 120000
max_input_chars = 32768
max_output_tokens = 2048
max_response_bytes = 1048576
direct_fallback = false

[dynamic_policy]
mode = "restrict_only"
failure_decision = "deny"
wallet_enforcement_wired = false
